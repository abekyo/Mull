name: Mull
options:
  bundleIdPrefix: com.mull
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.24.0"

targets:
  Mull:
    type: application
    platform: macOS
    sources:
      - Mull
    resources:
      - Mull/Resources
    dependencies:
      - package: GRDB
      # Build the MCP server alongside the app and embed it at
      # Mull.app/Contents/Helpers/MullMCP so one-click connect (AIToolSetup) points
      # AI tools at a real binary in shipped builds, not just dev.
      - target: MullMCP
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Mull/Resources/Info.plist
      properties:
        LSUIElement: false
        NSAccessibilityUsageDescription: "Mull uses Accessibility to read on-screen text and record your activity for daily summaries."
        NSMicrophoneUsageDescription: "Mull can optionally record audio for meeting transcription."
        NSCalendarsUsageDescription: "Mull reads your calendar to give AI context about your schedule."
        NSCalendarsFullAccessUsageDescription: "Mull reads your calendar to give AI context about your schedule."
        NSAppleEventsUsageDescription: "Mull asks your browser for the address of the page you are viewing, and Mail for the subject and sender of recent messages. It never reads message bodies."
    entitlements:
      path: Mull/Resources/Mull.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mull.app
        PRODUCT_NAME: Mull
        PRODUCT_MODULE_NAME: mull
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Manual
      # Debug and Release sign for opposite purposes, so they are split rather
      # than sharing one identity.
      #
      # Debug: a Development certificate, selected by SHA-1 hash, so macOS TCC
      # grants (Calendar, Accessibility, Input Monitoring) persist across
      # rebuilds instead of re-prompting. Hardened runtime is OFF because it
      # blocks the debugger from attaching, and the CGEvent tap is what you most
      # need a debugger for.
      #
      # MULL_CODE_SIGN_IDENTITY is machine-specific — a committed cert hash makes
      # the project unbuildable for anyone else. Set it in Local.xcconfig
      # (gitignored, pulled in by Signing.xcconfig, see Local.xcconfig.example);
      # leave it unset and signing falls back to ad-hoc "-", which builds and
      # runs fine but re-prompts for permissions on every rebuild.
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: false
          CODE_SIGN_IDENTITY: "$(MULL_CODE_SIGN_IDENTITY:default=-)"
        # Release: a Developer ID Application certificate plus the hardened
        # runtime, because notarization requires BOTH and rejects the build
        # otherwise. An Apple Development certificate cannot be notarized no
        # matter what else is set — see scripts/release.sh, which checks this
        # before spending a build on it.
        #
        # The default is still ad-hoc "-", so `xcodebuild -configuration Release`
        # keeps working on a clone with no certificate; such a build just is not
        # distributable. release.sh is the thing that refuses to proceed.
        Release:
          ENABLE_HARDENED_RUNTIME: true
          CODE_SIGN_IDENTITY: "$(MULL_DEVELOPER_ID_IDENTITY:default=-)"
    # Signing.xcconfig is tracked (so `xcodegen generate` works on a fresh clone)
    # and optionally includes the gitignored Local.xcconfig.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig

  MullTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Mull
      - package: GRDB
    settings:
      base:
        PRODUCT_NAME: MullTests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mull.app/Contents/MacOS/Mull"
        BUNDLE_LOADER: "$(TEST_HOST)"

  MullMCP:
    type: tool
    platform: macOS
    # Mull/Core is the UI-free layer both targets share: models, storage,
    # retrieval, classification, and the MCP server itself. Referencing the
    # DIRECTORY rather than listing files means adding a core file no longer
    # requires editing this list — the previous 21-path hand-maintained list
    # broke the CLI build with a confusing missing-symbol error every time
    # someone forgot to append to it.
    #
    # This target is also what keeps the layering honest: Mull/Core is compiled
    # here WITHOUT Mull/Views, so a core file that reaches for an app-layer type
    # (DS, a View, AppState) fails this build with "cannot find 'X' in scope".
    # Note it does not stop a core file from importing SwiftUI itself — that
    # compiles fine in a CLI target — so keep core UI-free by review, not by
    # trusting the compiler to catch the import alone.
    sources:
      - MullMCP
      - Mull/Core
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_NAME: MullMCP
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
      # This binary is copied into Mull.app/Contents/Helpers, so notarization
      # inspects it too: an embedded executable without the hardened runtime
      # fails the whole submission. Mirror the app's Debug/Release split.
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: false
        Release:
          ENABLE_HARDENED_RUNTIME: true
